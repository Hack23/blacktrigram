uot;&quot;,&quot;file&quot;:&quot;&quot;,&quot;beforeHooks&quot;:[],&quot;afterHooks&quot;:[],&quot;tests&quot;:[{&quot;title&quot;:&quot;should verify Three.js scene renders at stable framerate&quot;,&quot;fullTitle&quot;:&quot;Black Trigram - WebGL Rendering Verification Frame Rate Performance should verify Three.js scene renders at stable framerate&quot;,&quot;duration&quot;:8197,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;medium&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;code&quot;:&quot;cy.annotate(\&quot;Testing framerate stability\&quot;);\ncy.get(\&quot;canvas\&quot;).should(\&quot;be.visible\&quot;);\nlet frameCount = 0;\nlet startTime = 0;\ncy.window().then((win) =&gt; {\n    startTime = performance.now();\n    const measureFPS = () =&gt; {\n        frameCount++;\n        if (frameCount &lt; 60) {\n            win.requestAnimationFrame(measureFPS);\n        }\n        else {\n            const elapsed = performance.now() - startTime;\n            const fps = (frameCount / elapsed) * 1000;\n            cy.log(`Average FPS: ${fps.toFixed(2)}`);\n            // Target 60fps, allow some tolerance for software rendering\n            // Minimum 30fps acceptable, optimal 55-60fps\n            expect(fps).to.be.greaterThan(30);\n            if (fps &gt;= 55) {\n                cy.log(\&quot;✅ Excellent framerate (≥55fps)\&quot;);\n            }\n            else if (fps &gt;= 45) {\n                cy.log(\&quot;✅ Good framerate (45-55fps)\&quot;);\n            }\n            else {\n                cy.log(\&quot;⚠️ Acceptable framerate (30-45fps) - software rendering\&quot;);\n            }\n        }\n    };\n    win.requestAnimationFrame(measureFPS);\n});\n// Wait for measurement to complete\ncy.wait(2000);&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;8c72e613-cd24-4fa5-8516-f0890bf9d8ca&quot;,&quot;parentUUID&quot;:&quot;27f3d75d-ee86-47b3-9ba0-2f726619cffb&quot;,&quot;isHook&quot;:false,&quot;skipped
