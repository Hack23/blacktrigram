    <!-- PWA Service Worker Registration with Version Checking -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          // Check for development environment
          const isDevelopment =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1" ||
            window.location.hostname.startsWith("192.168.") ||
            window.location.hostname.startsWith("10.") ||
            window.location.hostname.includes(".app.github.dev") ||
            window.location.hostname.includes("gitpod.io") ||
            window.location.port !== "";

          // Skip SW in development to avoid caching issues
          if (isDevelopment) {
            console.log(
              "Development environment detected - skipping ServiceWorker registration"
            );
            // Unregister any existing SW
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              registrations.forEach((registration) => {
                registration.unregister();
                console.log("ServiceWorker unregistered for development");
              });
            });
            return;
          }

          const swPath = "./sw.js";
          navigator.serviceWorker
            .register(swPath)
            .then((registration) => {
              console.log(
                "ServiceWorker registration successful:",
                registration
              );

              // Check for updates every 60 seconds
              const updateCheckInterval = setInterval(() => {
                registration.update();
              }, 60000);

              // Clean up interval on page unload to prevent memory leaks
              window.addEventListener("beforeunload", () => {
                clearInterval(updateCheckInterval);
              });

              // Listen for new service worker waiting to activate
              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener("statechange", () => {
                    if (
                      newWorker.state === "installed" &&
                      navigator.serviceWorker.controller
                    ) {
                      // New version available - show update notification
                      console.log(
                        "New version available! Reloading to update..."
                      );

                      // Create update banner with accessibility support
                      const updateBanner = document.createElement("div");
                      updateBanner.id = "update-banner";
                      updateBanner.setAttribute("role", "alert");
                      updateBanner.setAttribute("aria-live", "assertive");
                      updateBanner.setAttribute("tabindex", "0");
                      updateBanner.style.cssText = `
                        position: fixed;
                        top: 0;
                        left: 0;
                        right: 0;
                        background: linear-gradient(135deg, #00ffd0 0%, #00aa88 100%);
                        color: #000;
                        padding: 16px;
                        text-align: center;
                        font-family: 'Orbitron', sans-serif;
                        font-weight: bold;
                        z-index: 10000;
                        box-shadow: 0 2px 10px rgba(0,255,208,0.3);
                        cursor: pointer;
                        animation: slideDown 0.3s ease-out;
                      `;
                      updateBanner.innerHTML = `
                        🎮 New version available! Tap to reload and get the latest features 🚀
                      `;

                      // Add animation (only if not already present)
                      if (
                        !document.getElementById("slideDown-animation-style")
                      ) {
                        const style = document.createElement("style");
                        style.id = "slideDown-animation-style";
                        style.textContent = `
                          @keyframes slideDown {
                            from { transform: translateY(-100%); }
                            to { transform: translateY(0); }
                          }
                        `;
                        document.head.appendChild(style);
                      }

                      // Guard to prevent double reload
                      let hasReloaded = false;

                      // Reload on click
                      updateBanner.addEventListener("click", () => {
                        if (!hasReloaded) {
                          hasReloaded = true;
                          window.location.reload();
                        }
                      });

                      // Reload on keyboard interaction (Enter or Space)
                      updateBanner.addEventListener("keydown", (e) => {
                        if (
                          (e.key === "Enter" || e.key === " ") &&
                          !hasReloaded
                        ) {
                          e.preventDefault();
                          hasReloaded = true;
                          window.location.reload();
                        }
                      });

                      document.body.appendChild(updateBanner);

                      // Auto-reload after 5 seconds if user doesn't click
                      setTimeout(() => {
                        if (!hasReloaded) {
                          hasReloaded = true;
                          window.location.reload();
                        }
                      }, 5000);
                    }
                  });
                }
              });
            })
            .catch((err) => {
              console.log("ServiceWorker registration failed:", err);
            });
        });
      }
    </script>
