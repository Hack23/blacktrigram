name: Knip - Unused Code Detection

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# All jobs declare their required permissions explicitly.
permissions: {}

jobs:
  knip:
    name: Detect unused files, exports & dependencies
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to check out code
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Knip (text report)
        id: knip-text
        run: |
          set +e
          npm run knip > knip-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          echo "::group::Knip Report"
          cat knip-report.txt
          echo "::endgroup::"

      - name: Run Knip (JSON for summary)
        if: always()
        run: |
          set +e
          npm run --silent knip -- --reporter json > knip-report.json
          set -e

      - name: Build job summary
        if: always()
        run: |
          {
            echo "## 🧹 Knip Unused Code Report"
            echo ""
            if [ -f knip-report.json ] && [ -s knip-report.json ]; then
              node -e '
                const fs = require("fs");
                const raw = fs.readFileSync("knip-report.json", "utf8");
                let data;
                try {
                  data = JSON.parse(raw);
                } catch (err) {
                  console.log("_Knip JSON report could not be parsed (non-JSON output, likely a Knip runtime error). See the text report below._");
                  console.log("");
                  console.log("<details><summary>Parse error</summary>");
                  console.log("");
                  console.log("```");
                  console.log(String(err && err.message ? err.message : err));
                  console.log("```");
                  console.log("");
                  console.log("</details>");
                  process.exit(0);
                }
                const counts = { files: 0, dependencies: 0, devDependencies: 0, unlisted: 0, binaries: 0, unresolved: 0, exports: 0, types: 0, enumMembers: 0, duplicates: 0 };
                for (const it of data.issues || []) {
                  for (const k of Object.keys(counts)) {
                    counts[k] += (it[k] || []).length;
                  }
                }
                console.log("| Category | Count |");
                console.log("| --- | ---: |");
                for (const [k, v] of Object.entries(counts)) {
                  console.log(`| ${k} | ${v} |`);
                }
              '
            else
              echo "_No JSON report produced._"
            fi
            echo ""
            echo "<details><summary>Full text report</summary>"
            echo ""
            echo '```'
            cat knip-report.txt 2>/dev/null || echo "(no report)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Knip reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knip-report
          path: |
            knip-report.txt
            knip-report.json
          retention-days: 14

      - name: Report Knip status
        if: always()
        run: |
          if [ "${{ steps.knip-text.outputs.exit_code }}" = "0" ]; then
            echo "::notice::Knip found no unused files, exports, or dependencies. ✅"
          else
            echo "::warning::Knip detected unused files, exports, or dependencies. See the job summary and the 'knip-report' artifact for details."
          fi
