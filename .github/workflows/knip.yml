name: Knip - Unused Code Detection

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Set default permissions to read-only (least privilege)
permissions: read-all

jobs:
  knip:
    name: Detect unused files, exports & dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out code
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Knip (text report)
        id: knip-text
        run: |
          set +e
          npm run knip > knip-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          echo "::group::Knip Report"
          cat knip-report.txt
          echo "::endgroup::"

      - name: Run Knip (JSON for summary)
        if: always()
        run: |
          set +e
          npm run --silent knip -- --reporter json > knip-report.json
          set -e

      - name: Build job summary
        if: always()
        run: |
          {
            echo "## 🧹 Knip Unused Code Report"
            echo ""
            if [ -f knip-report.json ] && [ -s knip-report.json ]; then
              node -e '
                const fs = require("fs");
                const data = JSON.parse(fs.readFileSync("knip-report.json", "utf8"));
                const counts = { files: 0, dependencies: 0, devDependencies: 0, unlisted: 0, binaries: 0, unresolved: 0, exports: 0, types: 0, enumMembers: 0, duplicates: 0 };
                for (const it of data.issues || []) {
                  for (const k of Object.keys(counts)) {
                    counts[k] += (it[k] || []).length;
                  }
                }
                console.log("| Category | Count |");
                console.log("| --- | ---: |");
                for (const [k, v] of Object.entries(counts)) {
                  console.log(`| ${k} | ${v} |`);
                }
              '
            else
              echo "_No JSON report produced._"
            fi
            echo ""
            echo "<details><summary>Full text report</summary>"
            echo ""
            echo '```'
            cat knip-report.txt 2>/dev/null || echo "(no report)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Knip reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: knip-report
          path: |
            knip-report.txt
            knip-report.json
          retention-days: 14

      - name: Report Knip status
        if: always()
        run: |
          if [ "${{ steps.knip-text.outputs.exit_code }}" = "0" ]; then
            echo "::notice::Knip found no unused files, exports, or dependencies. ✅"
          else
            echo "::warning::Knip detected unused files, exports, or dependencies. See the job summary and the 'knip-report' artifact for details."
          fi
