name: Asset Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'scripts/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  audit-assets:
    runs-on: ubuntu-latest
    
    # Limit GITHUB_TOKEN permissions for security
    permissions:
      contents: read
      issues: write  # For PR comments on failure
      pull-requests: write  # For PR comments on failure
    
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run asset audit
        run: npm run audit:assets
        
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Asset audit failed! Please check the workflow logs for missing asset references.'
            })
