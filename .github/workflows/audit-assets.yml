name: Asset Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'

jobs:
  audit-assets:
    runs-on: ubuntu-latest
    
    # Limit GITHUB_TOKEN permissions for security
    permissions:
      contents: read
      issues: write  # For PR comments on failure
      pull-requests: write  # For PR comments on failure
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run asset audit
        run: npm run audit:assets
        
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Asset audit failed! Please check the workflow logs for missing asset references.'
            })
