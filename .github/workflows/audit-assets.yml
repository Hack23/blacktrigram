name: Asset Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'scripts/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  audit-assets:
    runs-on: ubuntu-latest
    
    # Limit GITHUB_TOKEN permissions for security
    permissions:
      contents: read
      issues: write  # For PR comments on failure
      pull-requests: write  # For PR comments on failure
    
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run asset audit
        run: npm run audit:assets
        
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Asset audit failed! Please check the workflow logs for missing asset references.'
            })
