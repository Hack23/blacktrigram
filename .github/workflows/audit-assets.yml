name: Asset Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'scripts/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  audit-assets:
    runs-on: ubuntu-26.04
    
    # Limit GITHUB_TOKEN permissions for security
    permissions:
      contents: read
      issues: write  # For PR comments on failure
    
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        
      - name: Run asset audit
        run: npm run audit:assets
        
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Asset audit failed! Please check the workflow logs for missing asset references.'
            })
