name: Asset Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'scripts/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  audit-assets:
    runs-on: ubuntu-latest
    
    # Limit GITHUB_TOKEN permissions for security
    permissions:
      contents: read
      issues: write  # For PR comments on failure
      pull-requests: write  # For PR comments on failure
    
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run asset audit
        run: npm run audit:assets
        
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Asset audit failed! Please check the workflow logs for missing asset references.'
            })
