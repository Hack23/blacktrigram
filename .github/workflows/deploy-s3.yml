name: Deploy
on:
  workflow_dispatch:
    inputs:
      force_metadata_update:
        description: 'Force metadata update for all files (bypasses size-only check)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "blacktrigram-frontend-us-east-1-172017021075"
  CLOUDFRONT_STACK_NAME: "blacktrigram-frontend"
jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            cloudformation.us-east-1.amazonaws.com:443
            cloudfront.amazonaws.com:443
            s3.us-east-1.amazonaws.com:443
            s3.amazonaws.com:443
            blacktrigram-frontend-us-east-1-172017021075.s3.us-east-1.amazonaws.com:443
            blacktrigram-frontend-us-east-1-172017021075.s3.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::172017021075:role/GithubWorkFlowRole
          role-session-name: githubworkflowrolesessiont2
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to S3 with minimal API calls
        run: |
          # Optimized deployment: 8 sync operations instead of 16+
          # - Content-hashed assets (Vite build output) use --size-only + a 1-year
          #   immutable cache, since their filenames change whenever content changes.
          # - Non-hashed static assets (TypeDoc/coverage/mochawesome CSS+JS, which
          #   keep the SAME filename across releases, e.g. docs/api/assets/style.css)
          #   must NOT be marked immutable, otherwise browsers/CDNs never refetch
          #   updated CSS/JS and the docs pages render as broken/unstyled.
          # - HTML and metadata use default sync (size+mtime) to catch same-size content changes
          # - Does NOT use --delete to preserve legacy URLs on S3

          if [ "${{ github.event.inputs.force_metadata_update }}" = "true" ]; then
            # Force mode: use --exact-timestamps to force re-evaluation + metadata replace
            HASHED_SYNC_FLAGS="--exact-timestamps --metadata-directive REPLACE"
            DOCUMENT_SYNC_FLAGS="--exact-timestamps --metadata-directive REPLACE"
            echo "🚀 Force metadata update mode: re-uploading all files with updated metadata"
          else
            # Efficient mode: --size-only for hashed assets, default (size+mtime) for documents
            HASHED_SYNC_FLAGS="--size-only"
            DOCUMENT_SYNC_FLAGS=""
            echo "🚀 Efficient sync mode: --size-only for hashed assets, size+mtime for documents"
          fi

          # --- Deploy to root prefix (supports current URLs: blacktrigram.hack23.com/*)  ---

          # 1. Sync content-hashed Vite build assets (game bundle + test-results app) with immutable cache
          echo "⚡ [root] Syncing content-hashed assets with immutable cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "assets/*" \
            --include "test-results/assets/*" \
            --cache-control "public, max-age=31536000, immutable" \
            $HASHED_SYNC_FLAGS

          # 2. Sync all other static assets (TypeDoc api docs, coverage, cypress
          #    mochawesome, dependency/architecture diagrams, images, etc.) with a
          #    short revalidating cache, since these filenames are stable across
          #    releases and must be refetched whenever content changes.
          echo "📦 [root] Syncing non-hashed static assets with revalidation cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude ".git/*" \
            --exclude "assets/*" \
            --exclude "test-results/assets/*" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.json" \
            --exclude "*.txt" \
            --cache-control "public, max-age=3600, must-revalidate" \
            $DOCUMENT_SYNC_FLAGS

          # 3. Sync HTML files with short cache (must-revalidate, 1 hour)
          echo "📄 [root] Syncing HTML files with revalidation cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=3600, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            $DOCUMENT_SYNC_FLAGS

          # 4. Sync metadata files (xml, json, txt) with 1-day cache (not content-hashed)
          echo "📋 [root] Syncing metadata files with 1-day cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.xml" \
            --include "*.json" \
            --include "*.txt" \
            --cache-control "public, max-age=86400" \
            $DOCUMENT_SYNC_FLAGS

          # --- Deploy to /docs/ prefix (supports legacy URLs: blacktrigram.hack23.com/docs/*) ---

          # 5. Sync content-hashed assets to /docs/ with immutable cache
          echo "⚡ [/docs/] Syncing content-hashed assets with immutable cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/docs/ \
            --exclude "*" \
            --include "assets/*" \
            --include "test-results/assets/*" \
            --cache-control "public, max-age=31536000, immutable" \
            $HASHED_SYNC_FLAGS

          # 6. Sync all other static assets to /docs/ with revalidation cache
          echo "📦 [/docs/] Syncing non-hashed static assets with revalidation cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/docs/ \
            --exclude ".git/*" \
            --exclude "assets/*" \
            --exclude "test-results/assets/*" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.json" \
            --exclude "*.txt" \
            --cache-control "public, max-age=3600, must-revalidate" \
            $DOCUMENT_SYNC_FLAGS

          # 7. Sync HTML files to /docs/ with short cache
          echo "📄 [/docs/] Syncing HTML files with revalidation cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/docs/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=3600, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            $DOCUMENT_SYNC_FLAGS

          # 8. Sync metadata files to /docs/ with 1-day cache
          echo "📋 [/docs/] Syncing metadata files with 1-day cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/docs/ \
            --exclude "*" \
            --include "*.xml" \
            --include "*.json" \
            --include "*.txt" \
            --cache-control "public, max-age=86400" \
            $DOCUMENT_SYNC_FLAGS

          echo "✅ Deployment completed (8 sync ops instead of 16+, correctness-first caching)"

      # Invalidate CloudFront cache to ensure latest content is served
      - name: Invalidate CloudFront
        run: |
          echo "🔍 Discovering CloudFront distribution ID from stack: ${{ env.CLOUDFRONT_STACK_NAME }}"
          CloudFrontDistId=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CLOUDFRONT_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$CloudFrontDistId" ]; then
            echo "⚠️  Warning: CloudFront distribution ID not found in stack outputs"
            echo "Attempting to find distribution by S3 origin domain..."
            # List all distributions and filter by S3 bucket origin
            CloudFrontDistId=$(aws cloudfront list-distributions \
              --output json 2>/dev/null | \
              jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${{ env.S3_BUCKET_NAME }}\")) | .Id" | \
              head -n 1 || echo "")
          fi
          
          if [ -z "$CloudFrontDistId" ] || [ "$CloudFrontDistId" = "None" ]; then
            echo "❌ Error: Could not discover CloudFront distribution ID"
            exit 1
          fi
          
          echo "✅ Found CloudFront distribution: $CloudFrontDistId"
          echo "🔄 Creating cache invalidation for all paths..."
          
          aws cloudfront create-invalidation \
            --distribution-id $CloudFrontDistId \
            --paths "/*"
          
          echo "✅ CloudFront cache invalidation completed"
