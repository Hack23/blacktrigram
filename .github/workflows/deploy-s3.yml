name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_metadata_update:
        description: 'Force metadata update for all files (bypasses size-only check)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "blacktrigram-frontend-us-east-1-172017021075"
  CLOUDFRONT_STACK_NAME: "blacktrigram-frontend"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            cloudformation.us-east-1.amazonaws.com:443
            cloudfront.amazonaws.com:443
            s3.us-east-1.amazonaws.com:443
            s3.amazonaws.com:443
            blacktrigram-frontend-us-east-1-172017021075.s3.us-east-1.amazonaws.com:443
            blacktrigram-frontend-us-east-1-172017021075.s3.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::172017021075:role/GithubWorkFlowRole
          role-session-name: githubworkflowrolesessiont2
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to S3 with minimal API calls
        run: |
          # Optimized deployment: 4 sync operations instead of 16
          # Assumes existing S3 objects already have correct mime types and cache headers.
          # Uses --size-only to skip unchanged files (hashed assets are content-addressed).
          # Does NOT use --delete to preserve legacy URLs on S3.
          
          if [ "${{ github.event.inputs.force_metadata_update }}" = "true" ]; then
            SYNC_FLAGS="--metadata-directive REPLACE"
            echo "🚀 Force metadata update mode: re-uploading all files with metadata"
          else
            SYNC_FLAGS="--size-only"
            echo "🚀 Efficient sync mode: only uploading new/changed files (by size)"
          fi

          # --- Deploy to root prefix (supports current URLs: blacktrigram.hack23.com/*)  ---

          # 1. Sync all static assets (everything except HTML) with immutable cache
          echo "⚡ [root] Syncing static assets with immutable cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude ".git/*" \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable" \
            $SYNC_FLAGS

          # 2. Sync HTML files with short cache (must-revalidate, 1 hour)
          echo "📄 [root] Syncing HTML files with revalidation cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=3600, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            $SYNC_FLAGS

          # --- Deploy to /docs/ prefix (supports legacy URLs: blacktrigram.hack23.com/docs/*) ---

          # 3. Sync all static assets to /docs/ with immutable cache
          echo "⚡ [/docs/] Syncing static assets with immutable cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/docs/ \
            --exclude ".git/*" \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable" \
            $SYNC_FLAGS

          # 4. Sync HTML files to /docs/ with short cache
          echo "📄 [/docs/] Syncing HTML files with revalidation cache..."
          aws s3 sync docs/. s3://${{ env.S3_BUCKET_NAME }}/docs/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=3600, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            $SYNC_FLAGS

          echo "✅ Deployment completed (4 sync ops instead of 16, ~75% fewer CloudTrail events)"

      # Invalidate CloudFront cache to ensure latest content is served
      - name: Invalidate CloudFront
        run: |
          echo "🔍 Discovering CloudFront distribution ID from stack: ${{ env.CLOUDFRONT_STACK_NAME }}"
          CloudFrontDistId=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CLOUDFRONT_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$CloudFrontDistId" ]; then
            echo "⚠️  Warning: CloudFront distribution ID not found in stack outputs"
            echo "Attempting to find distribution by S3 origin domain..."
            # List all distributions and filter by S3 bucket origin
            CloudFrontDistId=$(aws cloudfront list-distributions \
              --output json 2>/dev/null | \
              jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${{ env.S3_BUCKET_NAME }}\")) | .Id" | \
              head -n 1 || echo "")
          fi
          
          if [ -z "$CloudFrontDistId" ] || [ "$CloudFrontDistId" = "None" ]; then
            echo "❌ Error: Could not discover CloudFront distribution ID"
            exit 1
          fi
          
          echo "✅ Found CloudFront distribution: $CloudFrontDistId"
          echo "🔄 Creating cache invalidation for all paths..."
          
          aws cloudfront create-invalidation \
            --distribution-id $CloudFrontDistId \
            --paths "/*"
          
          echo "✅ CloudFront cache invalidation completed"
