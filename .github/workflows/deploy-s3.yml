name: Deploy
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_reupload:
        description: 'Force re-upload all files to update metadata/headers (ignores size/timestamp checks)'
        required: false
        type: boolean
        default: false
permissions: write-all

env:
  AWS_REGION : "us-east-1"
  AWS_REGION_ZONE : "us-east-1"
  S3_BUCKET_NAME: "blacktrigram-frontend-us-east-1-172017021075"
  CLOUDFRONT_STACK_NAME: "blacktrigram-frontend"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: block
          allowed-endpoints: >
            accounts.google.com:443
            amazon-cloudfront-secure-static-site-s3bucketroot-14oliw5cmta06.s3.us-east-1.amazonaws.com:443
            api.github.com:443
            api.securityscorecards.dev:443
            app.fossa.io:443
            auth.docker.io:443
            bestpractices.coreinfrastructure.org:443
            cfu.zaproxy.org:443
            cla-assistant.io:443
            cla-assistant.io:80
            clients2.google.com:80
            cloudformation.us-east-1.amazonaws.com:443
            cloudfront.amazonaws.com:443
            content-signature-2.cdn.mozilla.net:443
            deb.debian.org:80
            firefox-settings-attachments.cdn.mozilla.net:443
            firefox.settings.services.mozilla.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            hack23.com:443
            hack23.com:80
            hack23.comnull:443
            img.shields.io:443
            isitmaintained.com:443
            isitmaintained.com:80
            location.services.mozilla.com:443
            news.zaproxy.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            r10.o.lencr.org:443
            r11.o.lencr.org:80
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            safebrowsingohttpgateway.googleapis.com:443
            shavar.services.mozilla.com:443
            slsa.dev:443
            sonarcloud.io:443
            storage.googleapis.com:443
            sts.us-east-1.amazonaws.com:443
            tel.zaproxy.org:443
            tracking-protection.cdn.mozilla.net:443
            us-central1-lighthouse-infrastructure.cloudfunctions.net:443
            www.google.com:443
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::172017021075:role/GithubWorkFlowRole
          role-session-name: githubworkflowrolesessiont2
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy to S3 with proper cache headers
        run: |
          echo "📦 Starting optimized S3 deployment with cache headers..."
          
          # Define common variables to avoid duplication
          SRC="docs/."
          DEST="s3://${{ env.S3_BUCKET_NAME }}/"
          COMMON_EXCLUDES='--exclude ".git/*" --exclude "screenshots/*"'
          IMMUTABLE_CACHE='--cache-control "public, max-age=31536000, immutable"'
          
          # Determine sync strategy based on force_reupload input
          if [ "${{ github.event.inputs.force_reupload }}" = "true" ]; then
            echo "🔄 Force re-upload enabled: All files will be re-uploaded to update metadata"
            SYNC_STRATEGY=""
          else
            echo "ℹ️  Using default sync strategy (size + timestamp comparison)"
            SYNC_STRATEGY=""
          fi
          echo ""
          
          # Sync JavaScript files with immutable cache headers
          echo "⚡ Syncing JavaScript files..."
          aws s3 sync "$SRC" "$DEST" \
            --exclude "*" \
            --include "*.js" \
            $COMMON_EXCLUDES \
            $IMMUTABLE_CACHE \
            --content-type "application/javascript" \
            $SYNC_STRATEGY
          
          # Sync CSS files with immutable cache headers
          echo "🎨 Syncing CSS files..."
          aws s3 sync "$SRC" "$DEST" \
            --exclude "*" \
            --include "*.css" \
            $COMMON_EXCLUDES \
            $IMMUTABLE_CACHE \
            --content-type "text/css" \
            $SYNC_STRATEGY
          
          # Sync font files with immutable cache headers
          echo "🔤 Syncing font files..."
          aws s3 sync "$SRC" "$DEST" \
            --exclude "*" \
            --include "*.woff" \
            --include "*.woff2" \
            --include "*.ttf" \
            --include "*.eot" \
            --include "*.otf" \
            $COMMON_EXCLUDES \
            $IMMUTABLE_CACHE \
            $SYNC_STRATEGY
          
          # Sync image files with immutable cache headers
          echo "🖼️  Syncing image files..."
          aws s3 sync "$SRC" "$DEST" \
            --exclude "*" \
            --include "*.webp" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.ico" \
            $COMMON_EXCLUDES \
            $IMMUTABLE_CACHE \
            $SYNC_STRATEGY
          
          # Sync HTML files with short cache and must-revalidate
          echo "📄 Syncing HTML files..."
          aws s3 sync "$SRC" "$DEST" \
            --exclude "*" \
            --include "*.html" \
            $COMMON_EXCLUDES \
            --cache-control "public, max-age=3600, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            $SYNC_STRATEGY
          
          # Sync metadata files with medium cache
          echo "📋 Syncing metadata files..."
          aws s3 sync "$SRC" "$DEST" \
            --exclude "*" \
            --include "*.xml" \
            --include "*.json" \
            --include "*.txt" \
            $COMMON_EXCLUDES \
            --cache-control "public, max-age=86400" \
            $SYNC_STRATEGY
          
          # Sync remaining files (catch-all)
          echo "📦 Syncing remaining files..."
          aws s3 sync "$SRC" "$DEST" \
            --exclude "*.js" \
            --exclude "*.css" \
            --exclude "*.woff" \
            --exclude "*.woff2" \
            --exclude "*.ttf" \
            --exclude "*.eot" \
            --exclude "*.otf" \
            --exclude "*.webp" \
            --exclude "*.png" \
            --exclude "*.jpg" \
            --exclude "*.jpeg" \
            --exclude "*.gif" \
            --exclude "*.svg" \
            --exclude "*.ico" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.json" \
            --exclude "*.txt" \
            $COMMON_EXCLUDES \
            $SYNC_STRATEGY
          
          echo ""
          echo "✅ S3 deployment completed with optimized cache headers"
          if [ "${{ github.event.inputs.force_reupload }}" = "true" ]; then
            echo "ℹ️  All files were re-uploaded to update metadata (force_reupload=true)"
          else
            echo "ℹ️  Only changed files were uploaded (default size+timestamp comparison)"
          fi

      # Invalidate CloudFront cache to ensure latest content is served
      - name: Invalidate CloudFront
        run: |
          echo "🔍 Discovering CloudFront distribution ID from stack: ${{ env.CLOUDFRONT_STACK_NAME }}"
          CloudFrontDistId=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CLOUDFRONT_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$CloudFrontDistId" ]; then
            echo "⚠️  Warning: CloudFront distribution ID not found in stack outputs"
            echo "Attempting to find distribution by S3 origin domain..."
            # List all distributions and filter by S3 bucket origin
            CloudFrontDistId=$(aws cloudfront list-distributions \
              --output json 2>/dev/null | \
              jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${{ env.S3_BUCKET_NAME }}\")) | .Id" | \
              head -n 1 || echo "")
          fi
          
          if [ -z "$CloudFrontDistId" ] || [ "$CloudFrontDistId" = "None" ]; then
            echo "❌ Error: Could not discover CloudFront distribution ID"
            exit 1
          fi
          
          echo "✅ Found CloudFront distribution: $CloudFrontDistId"
          echo "🔄 Creating cache invalidation for all paths..."
          
          aws cloudfront create-invalidation \
            --distribution-id $CloudFrontDistId \
            --paths "/*"
          
          echo "✅ CloudFront cache invalidation completed"
