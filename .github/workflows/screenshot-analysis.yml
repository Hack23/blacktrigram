name: Screenshot Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  capture-screenshots:
    name: Capture UI/UX Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.10.2
        with:
          egress-policy: audit
      
      - uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Three.js Test Environment
        run: |
          echo "🔧 Setting up Three.js test environment with optimized Chrome flags..."

          # Install all required dependencies in single layer
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 graphviz \
            libgtk2.0-0 libgtk-3-0 libgbm-dev \
            ffmpeg libnotify-dev libnss3 libxss1 \
            libxtst6 xauth \
            fonts-noto fonts-noto-cjk fonts-noto-cjk-extra \
            ca-certificates fonts-liberation \
            libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 \
            libnspr4 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 \
            libxrender1 libxshmfence1 xdg-utils wget

          # Install Chrome for Three.js WebGL support
          wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          # Setup D-Bus
          sudo mkdir -p /var/run/dbus
          sudo dbus-daemon --system --fork

          echo "✅ Three.js test environment ready"
          google-chrome --version

      - name: Install dependencies
        run: npm install

      - name: Cache Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Verify Cypress
        run: npx cypress verify
        
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      
      - name: Build application
        run: npm run build
      
      - name: Start Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -ac -screen 0 1280x1024x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2  # Give Xvfb time to start
      
      - name: Capture screenshots
        run: npm run screenshots:capture
        env:
          DISPLAY: :99
          CI: true
      
      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4.5.0
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 30
      
      - name: Commit screenshots to branch
        if: github.event_name == 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add screenshots/
          if ! git diff --staged --quiet; then
            git commit -m "📸 Add automated UI/UX screenshots"
            # Pull latest changes before pushing to handle concurrent updates
            git pull --rebase origin ${{ github.head_ref }}
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No screenshot changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Post screenshots to PR
        if: github.event_name == 'pull_request'
        run: npm run screenshots:post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      
      - name: Generate summary
        if: always()
        run: |
          echo "## 📸 Screenshot Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "screenshots/reports/ui-ux-analysis.md" ]; then
            cat screenshots/reports/ui-ux-analysis.md >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Screenshot analysis report not generated" >> $GITHUB_STEP_SUMMARY
          fi
