name: Screenshot Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  capture-screenshots:
    name: Capture UI/UX Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Suppress X11 keyboard configuration warnings
      XKB_DEFAULT_RULES: evdev
      XKB_DEFAULT_MODEL: pc105
      XKB_DEFAULT_LAYOUT: us

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache APT packages
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/screenshot-analysis.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Setup Screenshot Environment
        run: |
          echo "🔧 Setting up screenshot capture environment..."

          # Install dependencies for Playwright screenshot capture
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 \
            libgtk2.0-0 libgtk-3-0 libgbm-dev libgbm1 \
            libnotify-dev libnss3 libxss1 \
            libxtst6 xauth \
            fonts-noto fonts-noto-cjk fonts-noto-cjk-extra \
            ca-certificates fonts-liberation \
            libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libdrm2 \
            libnspr4 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 \
            libxrender1 libxshmfence1 xdg-utils libxkbcommon0 xkb-data

          # Setup D-Bus
          sudo mkdir -p /var/run/dbus
          sudo dbus-daemon --system --fork

          echo "✅ Screenshot environment ready"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Cache Playwright browsers
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Build application
        run: npm run build

      - name: Start Xvfb
        run: |
          Xvfb :99 -ac -screen 0 1280x1024x24 +extension GLX +extension RANDR +render -nolisten tcp > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2  # Give Xvfb time to start

      - name: Capture screenshots
        run: npm run screenshots:capture
        env:
          DISPLAY: :99
          CI: true

      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 30

      - name: Post screenshots to PR
        if: github.event_name == 'pull_request'
        run: npm run screenshots:post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
