name: Test and Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Set default permissions to read-only
permissions: read-all

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Only needs read permissions
    permissions:
      contents: read # Required to check out code
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.3.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run check

      - name: Run ESLint
        run: npm run lint

  build-validation:
    needs: prepare
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      id-token: write # Required for attestation
      pull-requests: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.3.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache Vite build cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-output
          path: dist
          if-no-files-found: error

  unit-tests:
    needs: [prepare, build-validation]
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.3.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests with coverage
        run: npm run coverage
        env:
          JEST_JUNIT_OUTPUT_DIR: "build/coverage"
          JEST_JUNIT_OUTPUT_NAME: "junit.xml"

  e2e-tests:
    needs: [prepare, build-validation]
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
      pull-requests: write
    env:
      CYPRESS_VIDEO: true
      # Suppress X11 keyboard configuration warnings
      XKB_DEFAULT_RULES: evdev
      XKB_DEFAULT_MODEL: pc105
      XKB_DEFAULT_LAYOUT: us
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.3.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Three.js Test Environment
        run: |
          echo "🔧 Setting up Three.js test environment with optimized Chrome flags..."

          # Install all required dependencies for E2E testing
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 graphviz \
            libgtk2.0-0 libgtk-3-0 libgbm-dev libgbm1 \
            libnotify-dev libnss3 libxss1 \
            libxtst6 xauth \
            fonts-noto fonts-noto-cjk fonts-noto-cjk-extra \
            ca-certificates fonts-liberation \
            libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libdrm2 \
            libnspr4 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 \
            libxrender1 libxshmfence1 xdg-utils wget libxkbcommon0 xkb-data

          # Install Chrome for Three.js WebGL support
          wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          # Setup D-Bus
          sudo mkdir -p /var/run/dbus
          sudo dbus-daemon --system --fork

          echo "✅ Three.js test environment ready"
          google-chrome --version

      - name: Cache Cypress binary
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Verify Cypress
        run: npx cypress verify

      - name: Start app and run Cypress tests with Three.js optimization
        run: |
          echo "🚀 Starting Three.js E2E test execution at $(date +%T)"
          echo "📊 Configuration:"
          echo "  - Chrome: $(google-chrome --version)"
          echo "  - Node memory: 4GB heap"
          echo "  - Display: $DISPLAY"
          echo "  - Target: 10-12 minute execution"
          echo ""
          START_TIME=$(date +%s) || START_TIME=0
          # Run tests - xvfb-run handles display setup
          NODE_OPTIONS="--max-old-space-size=4096" xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24 -ac +extension GLX +extension RANDR +render -nolisten tcp" npm run test:e2e || TEST_EXIT_CODE=$?
          END_TIME=$(date +%s) || END_TIME=$START_TIME
          if [ "$START_TIME" -ne 0 ]; then
            DURATION=$((END_TIME - START_TIME))
            echo "✅ E2E tests completed in ${DURATION} seconds"
            echo "e2e_duration=${DURATION}" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Could not measure test duration"
          fi
          # Exit with test exit code (0 if tests passed)
          exit ${TEST_EXIT_CODE:-0}
        env:
          CYPRESS_VIDEO: true
          TERM: dumb
        id: e2e_tests

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cypress-results
          path: |
            cypress/videos
            cypress/screenshots
            cypress/results

      - name: Report E2E execution time
        if: always()
        run: |
          if [ -n "${{ steps.e2e_tests.outputs.e2e_duration }}" ]; then
            echo "📊 E2E Test Execution Metrics"
            echo "================================"
            echo "Total Duration: ${{ steps.e2e_tests.outputs.e2e_duration }} seconds"
            echo "Previous baseline: 1500-1800 seconds (25-30 minutes)"
            echo "Current target: 900-1200 seconds (15-20 minutes)"
            echo "Final goal: 600-720 seconds (10-12 minutes)"
            
            DURATION=${{ steps.e2e_tests.outputs.e2e_duration }}
            if [ $DURATION -le 720 ]; then
              echo "🎯 EXCELLENT: Test execution at final goal (≤12 minutes)"
            elif [ $DURATION -le 1200 ]; then
              echo "✅ GOOD: Test execution within current target (≤20 minutes)"
            elif [ $DURATION -le 1800 ]; then
              echo "⚠️  NEEDS IMPROVEMENT: Test execution above target but below baseline (20-30 minutes)"
            else
              echo "❌ REGRESSION: Test execution above baseline (>30 minutes)"
            fi
            
            # Calculate improvement from baseline (assume 27 min = 1620 sec average)
            BASELINE=1620
            IMPROVEMENT=$((BASELINE - DURATION))
            PERCENT=$((IMPROVEMENT * 100 / BASELINE))
            if [ $IMPROVEMENT -gt 0 ]; then
              echo "📈 Improvement: ${IMPROVEMENT} seconds (${PERCENT}% faster than baseline)"
            else
              REGRESSION=$((DURATION - BASELINE))
              PERCENT=$((REGRESSION * 100 / BASELINE))
              echo "📉 Regression: ${REGRESSION} seconds (${PERCENT}% slower than baseline)"
            fi
          fi

  report:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.3.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install graphviz for reports
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Generate test reliability report
        continue-on-error: true
        run: |
          # Copy Cypress results for analysis
          if [ -d "artifacts/cypress-results" ]; then
            mkdir -p build/cypress/mochawesome
            find artifacts/cypress-results -name "*.json" -exec cp {} build/cypress/mochawesome/ \;
          fi

          # Generate reliability report
          npm run test:reliability || echo "No test results to analyze"

      - name: Upload combined reports
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-reports
          path: |
            coverage
            artifacts/cypress-results
            build/reports/test-reliability-report.html
