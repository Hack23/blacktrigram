name: Test and Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Set default permissions to read-only
permissions: read-all

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Only needs read permissions
    permissions:
      contents: read # Required to check out code
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup display and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz libgtk2.0-0 libgtk-3-0 ffmpeg libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth xvfb dbus dbus-x11 fonts-noto fonts-noto-cjk fonts-noto-cjk-extra && sudo apt-get update && sudo apt-get install -y ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxrender1 libxshmfence1 xdg-utils wget && wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - && echo \"deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main\" | sudo tee /etc/apt/sources.list.d/google-chrome.list && sudo apt-get update && sudo apt-get install -y google-chrome-stable 
          sudo mkdir -p /var/run/dbus
          sudo dbus-daemon --system --fork

      - name: Install dependencies
        run: npm install

      - name: Cache Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Verify Cypress
        run: npx cypress verify

  build-validation:
    needs: prepare
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      id-token: write # Required for attestation
      pull-requests: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache Vite build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-output
          path: dist
          if-no-files-found: error

  unit-tests:
    needs: [prepare, build-validation]
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests with coverage
        run: npm run coverage
        env:
          JEST_JUNIT_OUTPUT_DIR: "build/coverage"
          JEST_JUNIT_OUTPUT_NAME: "junit.xml"


  e2e-tests:
    needs: [prepare, build-validation]
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Start app and run Cypress tests
        run: |
          echo "🚀 Starting E2E test execution at $(date +%T)"
          START_TIME=$(date +%s) || START_TIME=0
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:e2e
          END_TIME=$(date +%s) || END_TIME=$START_TIME
          if [ "$START_TIME" -ne 0 ]; then
            DURATION=$((END_TIME - START_TIME))
            echo "✅ E2E tests completed in ${DURATION} seconds ($(date -u -d @${DURATION} +%T))"
            echo "e2e_duration=${DURATION}" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Could not measure test duration"
          fi
        env:
          CYPRESS_VIDEO: true
        id: e2e_tests

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cypress-results
          path: |
            cypress/videos
            cypress/screenshots
            cypress/results

      - name: Report E2E execution time
        if: always()
        run: |
          if [ -n "${{ steps.e2e_tests.outputs.e2e_duration }}" ]; then
            echo "📊 E2E Test Execution Metrics"
            echo "================================"
            echo "Total Duration: ${{ steps.e2e_tests.outputs.e2e_duration }} seconds"
            echo "Previous baseline: 1500-1800 seconds (25-30 minutes)"
            echo "Current target: 900-1200 seconds (15-20 minutes)"
            echo "Final goal: 600-720 seconds (10-12 minutes)"
            
            DURATION=${{ steps.e2e_tests.outputs.e2e_duration }}
            if [ $DURATION -le 720 ]; then
              echo "🎯 EXCELLENT: Test execution at final goal (≤12 minutes)"
            elif [ $DURATION -le 1200 ]; then
              echo "✅ GOOD: Test execution within current target (≤20 minutes)"
            elif [ $DURATION -le 1800 ]; then
              echo "⚠️  NEEDS IMPROVEMENT: Test execution above target but below baseline (20-30 minutes)"
            else
              echo "❌ REGRESSION: Test execution above baseline (>30 minutes)"
            fi
            
            # Calculate improvement from baseline (assume 27 min = 1620 sec average)
            BASELINE=1620
            IMPROVEMENT=$((BASELINE - DURATION))
            PERCENT=$((IMPROVEMENT * 100 / BASELINE))
            if [ $IMPROVEMENT -gt 0 ]; then
              echo "📈 Improvement: ${IMPROVEMENT} seconds (${PERCENT}% faster than baseline)"
            else
              REGRESSION=$((DURATION - BASELINE))
              PERCENT=$((REGRESSION * 100 / BASELINE))
              echo "📉 Regression: ${REGRESSION} seconds (${PERCENT}% slower than baseline)"
            fi
          fi

  e2e-screen-tests:
    needs: [prepare, build-validation]
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Run screen-specific E2E tests with timing
        run: |
          echo "⏱️ Running screen-specific E2E tests (Target: 3-4 min per screen)"
          echo "================================================================="
          
          # Start the dev server in the background
          npm run dev &
          DEV_PID=$!
          
          # Wait for server to be ready
          echo "Waiting for dev server to start..."
          npx wait-on http://localhost:5173 --timeout 120000
          
          # Array of screen tests
          declare -a screens=("intro" "combat" "training" "controls" "philosophy")
          declare -A screen_durations
          TOTAL_START=$(date +%s)
          
          for screen in "${screens[@]}"; do
            echo ""
            echo "📋 Testing ${screen}-screen..."
            START=$(date +%s)
            
            # Run the test and capture exit code
            set +e
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              npx cypress run --spec "cypress/e2e/screens/${screen}-screen.cy.ts" \
              --browser chrome --headless
            EXIT_CODE=$?
            set -e
            
            END=$(date +%s)
            DURATION=$((END - START))
            screen_durations["$screen"]=$DURATION
            
            echo "⏱️  ${screen}-screen: ${DURATION}s"
            
            # Check test result
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ ${screen}-screen tests PASSED"
            else
              echo "❌ ${screen}-screen tests FAILED (exit code: $EXIT_CODE)"
              FAILED_SCREENS="${FAILED_SCREENS} ${screen}"
            fi
            
            # Check against target (3-4 min = 180-240s)
            if [ $DURATION -le 240 ]; then
              echo "✅ ${screen}-screen within 4-minute target"
            else
              echo "⚠️  ${screen}-screen exceeded 4-minute target: ${DURATION}s"
            fi
          done
          
          # Kill dev server
          kill $DEV_PID || true
          
          # Report summary
          TOTAL_END=$(date +%s)
          TOTAL_DURATION=$((TOTAL_END - TOTAL_START))
          
          echo ""
          echo "📊 Screen-Specific E2E Test Summary"
          echo "===================================="
          for screen in "${screens[@]}"; do
            DURATION="${screen_durations[$screen]:-0}"
            echo "${screen}-screen: ${DURATION}s"
          done
          echo ""
          echo "Total Duration: ${TOTAL_DURATION}s ($(($TOTAL_DURATION / 60))m $(($TOTAL_DURATION % 60))s)"
          echo "Target: 900-1200s (15-20 minutes)"
          
          if [ $TOTAL_DURATION -le 1200 ]; then
            echo "✅ Within 20-minute target"
          else
            echo "⚠️  Exceeded 20-minute target"
          fi
          
          # Fail the job if any screen tests failed
          if [ -n "$FAILED_SCREENS" ]; then
            echo ""
            echo "❌ Failed screens:$FAILED_SCREENS"
            exit 1
          fi
        env:
          CYPRESS_VIDEO: true
        id: screen_tests

      - name: Upload screen test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screen-test-results
          path: |
            cypress/videos
            cypress/screenshots
            cypress/results

  report:
    needs: [unit-tests, e2e-tests, e2e-screen-tests]
    runs-on: ubuntu-latest
    if: always()
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Generate test reliability report
        continue-on-error: true
        run: |
          # Copy Cypress results for analysis
          if [ -d "artifacts/cypress-results" ]; then
            mkdir -p build/cypress/mochawesome
            find artifacts/cypress-results -name "*.json" -exec cp {} build/cypress/mochawesome/ \;
          fi
          
          # Generate reliability report
          npm run test:reliability || echo "No test results to analyze"

      - name: Upload combined reports
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-reports
          path: |
            coverage
            artifacts/cypress-results
            build/reports/test-reliability-report.html
