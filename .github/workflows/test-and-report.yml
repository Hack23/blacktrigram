name: Test and Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Set default permissions to read-only
permissions: read-all

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Only needs read permissions
    permissions:
      contents: read # Required to check out code
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup display and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz libgtk2.0-0 libgtk-3-0 ffmpeg libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth xvfb dbus dbus-x11 fonts-noto fonts-noto-cjk fonts-noto-cjk-extra && sudo apt-get update && sudo apt-get install -y ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxrender1 libxshmfence1 xdg-utils wget && wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - && echo \"deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main\" | sudo tee /etc/apt/sources.list.d/google-chrome.list && sudo apt-get update && sudo apt-get install -y google-chrome-stable 
          sudo mkdir -p /var/run/dbus
          sudo dbus-daemon --system --fork

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Cache Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Verify Cypress
        run: npx cypress verify

  build-validation:
    needs: prepare
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      id-token: write # Required for attestation
      pull-requests: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-output
          path: dist
          if-no-files-found: error

  unit-tests:
    needs: [prepare, build-validation]
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests with coverage
        run: npm run coverage
        env:
          JEST_JUNIT_OUTPUT_DIR: "build/coverage"
          JEST_JUNIT_OUTPUT_NAME: "junit.xml"


  e2e-tests:
    needs: [prepare, build-validation]
    runs-on: ubuntu-latest
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Start app and run Cypress tests
        run: |
          echo "🚀 Starting E2E test execution at $(date +%T)"
          START_TIME=$(date +%s) || START_TIME=0
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:e2e
          END_TIME=$(date +%s) || END_TIME=$START_TIME
          if [ "$START_TIME" -ne 0 ]; then
            DURATION=$((END_TIME - START_TIME))
            echo "✅ E2E tests completed in ${DURATION} seconds ($(date -u -d @${DURATION} +%T))"
            echo "e2e_duration=${DURATION}" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Could not measure test duration"
          fi
        env:
          CYPRESS_VIDEO: true
        id: e2e_tests

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cypress-results
          path: |
            cypress/videos
            cypress/screenshots
            cypress/results

      - name: Report E2E execution time
        if: always()
        run: |
          if [ -n "${{ steps.e2e_tests.outputs.e2e_duration }}" ]; then
            echo "📊 E2E Test Execution Metrics"
            echo "================================"
            echo "Total Duration: ${{ steps.e2e_tests.outputs.e2e_duration }} seconds"
            echo "Target: 600-720 seconds (10-12 minutes)"
            
            DURATION=${{ steps.e2e_tests.outputs.e2e_duration }}
            if [ $DURATION -le 720 ]; then
              echo "✅ PASS: Test execution within target (≤12 minutes)"
            elif [ $DURATION -le 900 ]; then
              echo "⚠️  WARNING: Test execution slightly over target (12-15 minutes)"
            else
              echo "❌ FAIL: Test execution significantly over target (>15 minutes)"
            fi
          fi

  # New job: Flakiness detection for pull requests
  flakiness-detection:
    needs: e2e-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run E2E tests 3 times to detect flakiness
        continue-on-error: true
        run: |
          mkdir -p flaky-test-results
          FLAKY_COUNT=0
          
          for i in {1..3}; do
            echo "🔄 Flakiness Detection Run $i of 3"
            if ! xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:e2e:smoke; then
              echo "FAIL" >> flaky-test-results/run-$i.txt
              FLAKY_COUNT=$((FLAKY_COUNT + 1))
            else
              echo "PASS" >> flaky-test-results/run-$i.txt
            fi
            
            # Copy results for analysis
            if [ -d "build/cypress/mochawesome" ]; then
              mkdir -p "flaky-test-results/run-$i"
              cp build/cypress/mochawesome/*.json "flaky-test-results/run-$i/" 2>/dev/null || true
            fi
            
            # Small delay between runs
            sleep 5
          done
          
          echo "FLAKY_COUNT=$FLAKY_COUNT" >> $GITHUB_ENV

      - name: Analyze flakiness
        run: |
          echo "📊 Flakiness Detection Results:"
          echo "================================"
          
          if [ -f "flaky-test-results/run-1.txt" ]; then
            for i in {1..3}; do
              if [ -f "flaky-test-results/run-$i.txt" ]; then
                result=$(cat "flaky-test-results/run-$i.txt")
                echo "Run $i: $result"
              fi
            done
          fi
          
          if [ "${FLAKY_COUNT:-0}" -gt 0 ] && [ "${FLAKY_COUNT:-0}" -lt 3 ]; then
            echo ""
            echo "⚠️  Flaky tests detected! Failed ${FLAKY_COUNT} out of 3 runs"
            echo "This indicates test instability that should be investigated."
            exit 1
          elif [ "${FLAKY_COUNT:-0}" -eq 3 ]; then
            echo ""
            echo "❌ Tests failed consistently in all 3 runs"
            echo "This is a consistent failure, not flakiness."
            exit 1
          else
            echo ""
            echo "✅ No flaky tests detected - all 3 runs passed!"
          fi

      - name: Upload flakiness detection results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: flakiness-detection-results
          path: flaky-test-results/

  report:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    # Needs write permissions to upload artifacts
    permissions:
      contents: write # Required to check out code
      actions: read # Required to use GitHub actions
      checks: write # Required to upload artifacts (implicit permission)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Generate test reliability report
        continue-on-error: true
        run: |
          # Copy Cypress results for analysis
          if [ -d "artifacts/cypress-results" ]; then
            mkdir -p build/cypress/mochawesome
            find artifacts/cypress-results -name "*.json" -exec cp {} build/cypress/mochawesome/ \;
          fi
          
          # Generate reliability report
          npm run test:reliability || echo "No test results to analyze"

      - name: Upload combined reports
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-reports
          path: |
            coverage
            artifacts/cypress-results
            build/reports/test-reliability-report.html
