name: Copilot Setup Steps
description: Pre-installation steps for Copilot Workspace to prepare the development environment

# This file configures the environment setup for GitHub Copilot Workspace
# It ensures all necessary dependencies are installed before the agent starts working

on:
  copilot_workspace_setup

steps:
  - name: Setup Node.js environment
    uses: actions/setup-node@v4
    with:
      node-version: '24'
      cache: 'npm'

  - name: Install system dependencies for PixiJS and graphics
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        graphviz \
        libgtk2.0-0 \
        libgtk-3-0 \
        ffmpeg \
        libgbm-dev \
        libnotify-dev \
        libnss3 \
        libxss1 \
        libasound2 \
        libxtst6 \
        xauth \
        xvfb \
        dbus \
        dbus-x11 \
        fonts-noto \
        fonts-noto-cjk \
        fonts-noto-cjk-extra

  - name: Install Chrome for testing
    run: |
      wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
      echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      sudo apt-get update
      sudo apt-get install -y google-chrome-stable

  - name: Setup display server for headless testing
    run: |
      sudo mkdir -p /var/run/dbus
      sudo dbus-daemon --system --fork

  - name: Install npm dependencies
    run: npm ci --ignore-scripts

  - name: Install Cypress binary (if needed)
    run: |
      if [ -d "cypress" ]; then
        npx cypress install || echo "Cypress installation skipped"
      fi

  - name: Verify TypeScript compilation
    run: npm run check || echo "TypeScript check completed with warnings"

  - name: Install global development tools
    run: |
      npm install -g \
        typescript@latest \
        eslint@latest \
        @modelcontextprotocol/server-github \
        @modelcontextprotocol/server-filesystem \
        @modelcontextprotocol/server-sequential-thinking \
        @executeautomation/playwright-mcp-server

environment:
  # Environment variables for PixiJS and testing
  DISPLAY: ":99"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_FUND: "false"
  NODE_ENV: "development"
  # GitHub token will be automatically provided by Copilot Workspace
  GITHUB_TOKEN: "${GITHUB_TOKEN}"
