name-template: "Release $RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"

# Categories match exactly with PR labels from labeler.yml
categories:
  - title: "🚀 New Features"
    labels:
      - "feature"
      - "enhancement"

  - title: "🎮 Game Development"
    labels:
      - "game-logic"
      - "graphics"
      - "audio"
      - "pixi-components"

  - title: "🎨 UI/UX Improvements"
    labels:
      - "ui"
      - "design"
      - "style"

  - title: "🏗️ Infrastructure & Performance"
    labels:
      - "infrastructure"
      - "performance"
      - "build"
      - "config"

  - title: "🔄 Code Quality & Refactoring"
    labels:
      - "refactor"
      - "testing"
      - "types"

  - title: "🔒 Security & Compliance"
    labels:
      - "security"

  - title: "📝 Documentation"
    labels:
      - "documentation"

  - title: "📦 Dependencies"
    labels:
      - "dependencies"

  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
      - "fix"

  - title: "🧪 Test Coverage Improvements"
    labels:
      - "test-coverage-impact"
      - "needs-tests"
      - "e2e"
      - "high-coverage"

  - title: "🎨 Assets & Resources"
    labels:
      - "assets"

  - title: "🔧 Development Environment"
    labels:
      - "devcontainer"

  - title: "⚙️ Component Updates"
    labels:
      - "component-app"
      - "component-main"
      - "component-game"
      - "component-ui"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

exclude-labels:
  - "skip-changelog"
  - "duplicate"
  - "invalid"
  - "wontfix"

include-paths:
  - "src"
  - "public"
  - "docs"
  - ".github"
  - ".devcontainer"

template: |
  # Highlights
  $CHANGES

  ## Security & Quality
  [![OpenSSF Scorecard](https://api.securityscorecards.dev/projects/github.com/Hack23/blacktrigram/badge)](https://scorecard.dev/viewer/?uri=github.com/Hack23/blacktrigram)

  ## Security Compliance
  [![SLSA 3](https://slsa.dev/images/gh-badge-level3.svg)](https://github.com/Hack23/blacktrigram/attestations/)

  ## Game Development Stack
  - ⚡ **Vite** - Fast build tool and dev server
  - ⚛️ **React 19** - Modern React with hooks  
  - 🔷 **TypeScript** - Strict typing with latest standards
  - 🎮 **PixiJS 8.x** - High-performance WebGL renderer
  - 🎵 **Howler.js** - Audio library for games
  - 🧪 **Vitest** - Fast unit testing with coverage
  - 🌲 **Cypress** - Reliable E2E testing

  ## Contributors
  Thanks to $CONTRIBUTORS for their contributions to this release!

  **Full Changelog**: https://github.com/Hack23/blacktrigram/compare/$PREVIOUS_TAG...$RESOLVED_VERSION

version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "feature"
      - "enhancement"
      - "game-logic"
      - "graphics"
      - "audio"
  patch:
    labels:
      - "bug"
      - "fix"
      - "security"
      - "dependencies"
      - "documentation"
      - "performance"
      - "refactor"
  default: patch

# Autolabeler is BACKUP for PRs without labels
# Primary labeling happens via .github/labeler.yml
autolabeler:
  # Features & Enhancements
  - label: "feature"
    title:
      - '/^feat(\([^)]+\))?:/i'
      - '/^feature(\([^)]+\))?:/i'
      - '/^add(\([^)]+\))?:/i'
  
  - label: "enhancement"
    title:
      - '/^enhance(\([^)]+\))?:/i'
      - '/^improve(\([^)]+\))?:/i'
  
  # Bug Fixes
  - label: "bug"
    title:
      - '/^fix(\([^)]+\))?:/i'
      - '/^bug(\([^)]+\))?:/i'
    branch:
      - '/^fix\/.+/'
      - '/^bugfix\/.+/'
  
  - label: "fix"
    title:
      - '/^fix(\([^)]+\))?:/i'
  
  # Documentation
  - label: "documentation"
    title:
      - '/^docs(\([^)]+\))?:/i'
      - '/^doc(\([^)]+\))?:/i'
    files:
      - '**/*.md'
      - 'docs/**/*'
  
  # UI/UX
  - label: "ui"
    title:
      - '/^ui(\([^)]+\))?:/i'
  
  - label: "design"
    title:
      - '/^design(\([^)]+\))?:/i'
  
  - label: "style"
    title:
      - '/^style(\([^)]+\))?:/i'
  
  # Dependencies - CRITICAL FOR DEPENDABOT/RENOVATE
  - label: "dependencies"
    title:
      - '/^build\(deps\):/i'
      - '/^build\(deps-dev\):/i'
      - '/^chore\(deps\):/i'
      - '/^chore\(deps-dev\):/i'
      - '/^deps(\([^)]+\))?:/i'
      - '/^dependency(\([^)]+\))?:/i'
      - '/^bump/i'
      - '/^update.*dependenc/i'
    files:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
    branch:
      - '/^dependabot\/.+/'
      - '/^renovate\/.+/'
  
  # Security
  - label: "security"
    title:
      - '/^security(\([^)]+\))?:/i'
      - '/^sec(\([^)]+\))?:/i'
      - '/\[security\]/i'
  
  # Performance
  - label: "performance"
    title:
      - '/^perf(\([^)]+\))?:/i'
      - '/^optimize(\([^)]+\))?:/i'
  
  # Infrastructure
  - label: "infrastructure"
    title:
      - '/^infra(\([^)]+\))?:/i'
      - '/^ci(\([^)]+\))?:/i'
    files:
      - '.github/**/*'
  
  - label: "build"
    title:
      - '/^build(\([^)]+\))?:/i'
      - '/^chore\(build\):/i'
  
  - label: "config"
    title:
      - '/^config(\([^)]+\))?:/i'
  
  # Code Quality
  - label: "refactor"
    title:
      - '/^refactor(\([^)]+\))?:/i'
  
  - label: "testing"
    title:
      - '/^test(\([^)]+\))?:/i'
  
  - label: "types"
    title:
      - '/^types(\([^)]+\))?:/i'
    files:
      - '**/*.d.ts'
      - 'types/**/*'
  
  # Game Development
  - label: "game-logic"
    title:
      - '/^game(\([^)]+\))?:/i'
      - '/^logic(\([^)]+\))?:/i'
  
  - label: "graphics"
    title:
      - '/^graphics(\([^)]+\))?:/i'
      - '/^render(\([^)]+\))?:/i'
  
  - label: "audio"
    title:
      - '/^audio(\([^)]+\))?:/i'
      - '/^sound(\([^)]+\))?:/i'
  
  - label: "pixi-components"
    title:
      - '/^pixi(\([^)]+\))?:/i'
    files:
      - '**/pixi/**/*'
      - '**/*pixi*.ts'
      - '**/*pixi*.tsx'
  
  # E2E Testing
  - label: "e2e"
    title:
      - '/^e2e(\([^)]+\))?:/i'
    files:
      - 'cypress/**/*'
  
  # Assets
  - label: "assets"
    files:
      - 'public/**/*.png'
      - 'public/**/*.jpg'
      - 'public/**/*.svg'
      - 'public/**/*.mp3'
      - 'public/**/*.wav'
  
  # DevContainer
  - label: "devcontainer"
    files:
      - '.devcontainer/**/*'
