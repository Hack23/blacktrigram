version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "feature"
      - "enhancement"
      - "game-logic"
      - "graphics"
      - "audio"
  patch:
    labels:
      - "bug"
      - "fix"
      - "security"
      - "dependencies"
      - "documentation"
      - "performance"
      - "refactor"
  default: patch

# Autolabeler is BACKUP for PRs without labels
# Primary labeling happens via .github/labeler.yml
autolabeler:
  # Features & Enhancements
  - label: "feature"
    title:
      - '/^feat(\([^)]+\))?:/i'
      - '/^feature(\([^)]+\))?:/i'
      - '/^add(\([^)]+\))?:/i'
  
  - label: "enhancement"
    title:
      - '/^enhance(\([^)]+\))?:/i'
      - '/^improve(\([^)]+\))?:/i'
  
  # Bug Fixes
  - label: "bug"
    title:
      - '/^fix(\([^)]+\))?:/i'
      - '/^bug(\([^)]+\))?:/i'
  
  - label: "fix"
    title:
      - '/^fix(\([^)]+\))?:/i'
  
  # Documentation
  - label: "documentation"
    title:
      - '/^docs(\([^)]+\))?:/i'
      - '/^doc(\([^)]+\))?:/i'
  
  # UI/UX
  - label: "ui"
    title:
      - '/^ui(\([^)]+\))?:/i'
  
  - label: "design"
    title:
      - '/^design(\([^)]+\))?:/i'
  
  - label: "style"
    title:
      - '/^style(\([^)]+\))?:/i'
  
  # Dependencies - CRITICAL FOR DEPENDABOT/RENOVATE
  - label: "dependencies"
    title:
      - '/^build\(deps\):/i'
      - '/^build\(deps-dev\):/i'
      - '/^chore\(deps\):/i'
      - '/^chore\(deps-dev\):/i'
      - '/^deps(\([^)]+\))?:/i'
      - '/^dependency(\([^)]+\))?:/i'
      - '/^bump/i'
      - '/^update.*dependenc/i'
    files:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
  
  # Security
  - label: "security"
    title:
      - '/^security(\([^)]+\))?:/i'
      - '/^sec(\([^)]+\))?:/i'
      - '/\[security\]/i'
  
  # Performance
  - label: "performance"
    title:
      - '/^perf(\([^)]+\))?:/i'
      - '/^optimize(\([^)]+\))?:/i'
  
  # Infrastructure
  - label: "infrastructure"
    title:
      - '/^infra(\([^)]+\))?:/i'
      - '/^ci(\([^)]+\))?:/i'
    files:
      - '.github/**/*'
  
  - label: "build"
    title:
      - '/^build(\([^)]+\))?:/i'
      - '/^chore\(build\):/i'
  
  - label: "config"
    title:
      - '/^config(\([^)]+\))?:/i'
  
  # Code Quality
  - label: "refactor"
    title:
      - '/^refactor(\([^)]+\))?:/i'
  
  - label: "testing"
    title:
      - '/^test(\([^)]+\))?:/i'
  
  - label: "types"
    title:
      - '/^types(\([^)]+\))?:/i'
    files:
      - '**/*.d.ts'
      - 'types/**/*'
  
  # Game Development
  - label: "game-logic"
    title:
      - '/^game(\([^)]+\))?:/i'
      - '/^logic(\([^)]+\))?:/i'
  
  - label: "graphics"
    title:
      - '/^graphics(\([^)]+\))?:/i'
      - '/^render(\([^)]+\))?:/i'
  
  - label: "audio"
    title:
      - '/^audio(\([^)]+\))?:/i'
      - '/^sound(\([^)]+\))?:/i'
  
  - label: "three-components"
    title:
      - '/^three(\([^)]+\))?:/i'
      - '/^3d(\([^)]+\))?:/i'
    files:
      - '**/three/**/*'
      - '**/*three*.ts'
      - '**/*three*.tsx'
      - '**/*3d*.ts'
      - '**/*3d*.tsx'
  
  # E2E Testing
  - label: "e2e"
    title:
      - '/^e2e(\([^)]+\))?:/i'
    files:
      - 'cypress/**/*'
  
  # Assets
  - label: "assets"
    files:
      - 'public/**/*.png'
      - 'public/**/*.jpg'
      - 'public/**/*.svg'
      - 'public/**/*.mp3'
      - 'public/**/*.wav'
  
  # DevContainer
  - label: "devcontainer"
    files:
      - '.devcontainer/**/*'
