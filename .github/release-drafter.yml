      - "ui"
      - "design"
      - "style"

  - title: "🏗️ Infrastructure & Performance"
    labels:
      - "infrastructure"
      - "performance"
      - "build"
      - "config"

  - title: "🔄 Code Quality & Refactoring"
    labels:
      - "refactor"
      - "testing"
      - "types"

  - title: "🔒 Security & Compliance"
    labels:
      - "security"

  - title: "📝 Documentation"
    labels:
      - "documentation"

  - title: "📦 Dependencies"
    labels:
      - "dependencies"
      - "javascript"
      - "github_actions"

  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
      - "fix"

  - title: "🧪 Test Coverage Improvements"
    labels:
      - "test-coverage-impact"
