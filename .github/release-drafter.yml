change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

template: |
  # Highlights
  $CHANGES

  ## 🎮 Black Trigram - Korean Martial Arts Combat System
  This release continues to enhance the Black Trigram (흑괘) platform's capabilities for immersive Korean martial arts education through realistic 3D combat mechanics, providing improved insights into:
  - **Eight Trigram System**: Authentic Korean martial arts stance mechanics (☰ ☱ ☲ ☳ ☴ ☵ ☶ ☷)
  - **Vital Point Targeting**: Anatomically precise 70-point targeting system (급소격)
  - **Three.js Combat**: High-performance 3D rendering with @react-three/fiber
  - **Combat Realism**: Physics-based combat with injury progression and balance systems
  - **Korean Cultural Authenticity**: Bilingual interface with traditional martial arts philosophy

  ## 📦 npm Package
  [![npm version](https://img.shields.io/npm/v/blacktrigram?style=flat-square&logo=npm)](https://www.npmjs.com/package/blacktrigram)

  ```bash
  npm install blacktrigram
  # or to pin to a specific version:
  # npm install blacktrigram@<version>
  ```

  Reusable game systems, combat mechanics, animation framework, and Korean martial arts data built with React, Three.js, and TypeScript.

  ## 🔐 Security Compliance & Supply Chain Transparency
  [![SLSA 3](https://slsa.dev/images/gh-badge-level3.svg)](https://github.com/Hack23/blacktrigram/attestations)
  [![OpenSSF Scorecard](https://api.securityscorecards.dev/projects/github.com/Hack23/blacktrigram/badge)](https://scorecard.dev/viewer/?uri=github.com/Hack23/blacktrigram)
  [![CII Best Practices](https://bestpractices.coreinfrastructure.org/projects/10777/badge)](https://bestpractices.coreinfrastructure.org/projects/10777)
  [![FOSSA Status](https://app.fossa.io/api/projects/git%2Bgithub.com%2FHack23%2Fblacktrigram.svg?type=shield)](https://app.fossa.io/projects/git%2Bgithub.com%2FHack23%2Fblacktrigram?ref=badge_shield)
