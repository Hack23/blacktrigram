                  - paragraph [ref=e1897]: "Several weaknesses must be addressed to achieve v1.0 production readiness and market competitiveness:"
                  - list [ref=e1898]:
                    - listitem [ref=e1899]:
                      - paragraph [ref=e1900]:
                        - strong [ref=e1901]: 🌀 No Backend/Persistence (Session-Only Storage)
                        - text: ": All player progress is lost on browser refresh, with no saved training logs, unlocked techniques, long-term advancement tracking, or cloud saves. No multiplayer capability without backend infrastructure."
                        - strong [ref=e1902]: Mitigation
                        - text: ": AWS serverless backend planned for v2.0 (2028) with Cognito auth, DynamoDB persistence, S3 storage; IndexedDB fallback for v1.0 local saves."
                    - listitem [ref=e1903]:
                      - paragraph [ref=e1904]:
                        - strong [ref=e1905]: 📱 Mobile Performance (30-45fps vs. 60fps Desktop)
                        - text: ": Mobile browsers achieve only 30-45fps vs. desktop 60fps target (55-60fps minimum goal). Mobile optimization critical for accessibility and player acquisition."
                        - strong [ref=e1906]: Measured
                        - text: ": Performance benchmarks Q1 2026."
                        - strong [ref=e1907]: Mitigation
                        - text: ": Q2-Q3 2026 optimization focus - reduce particle count, optimize rendering, implement LOD system, progressive enhancement."
                    - listitem [ref=e1908]:
                      - paragraph [ref=e1909]:
                        - strong [ref=e1910]:
                          - generic [ref=e1911]: ⚠️
                          - text: Combat Realism Incomplete (67% - 8/12 Systems)
                        - text: ": Only 8/12 combat realism systems production-ready. Missing: Injury-based movement (10%), Bone impact audio (0%), Trauma visualization needs integration (65%)."
                        - strong [ref=e1912]: Measured
                        - text: ": game-status.md Q1 2026."
                        - strong [ref=e1913]: Mitigation
                        - text: ": Complete remaining 4 systems by v1.0 Q2-Q3 2026."
                    - listitem [ref=e1914]:
                      - paragraph [ref=e1915]:
                        - strong [ref=e1916]: 💰 No Monetization Implemented
                        - text: ": Zero revenue stream, no payment system, no in-app purchases, no business model implementation. Limits sustainability and growth funding."
                        - strong [ref=e1917]: Mitigation
                        - text: ": Ethical F2P planned post-v1.0 with cosmetics (non-pay-to-win), optional battle pass, respectful ads, Stripe integration v2.0."
                    - listitem [ref=e1918]:
                      - paragraph [ref=e1919]:
                        - strong [ref=e1920]: 👥 Unknown Brand (No Player Base)
                        - text: ": Pre-launch beta status means zero active players, no community, no brand recognition vs. competitors (Sifu 1M+, Tekken 2M+, For Honor 5M+)."
                        - strong [ref=e1921]: Mitigation
                        - text: ": Grassroots community building 2026-2027, martial arts school partnerships, Korean cultural event sponsorships, open source transparency, developer engagement, martial arts influencer outreach."
                    - listitem [ref=e1922]:
                      - paragraph [ref=e1923]:
                        - strong [ref=e1924]: 🎯 Niche Market (Korean Martial Arts Focus)
                        - text: ": Specialized audience limits mainstream appeal vs. broad fighting game market. Blue Ocean advantage but smaller addressable market."
                        - strong [ref=e1925]: Mitigation
                        - text: ": Embrace niche as strength - educational market ($17B growing 15% annually), martial arts schools, universities, Korean Wave (한류) cultural appeal; expand to broader martial arts later."
                    - listitem [ref=e1926]:
                      - paragraph [ref=e1927]:
                        - strong [ref=e1928]: 🐢 Asset Load Latency
                        - text: ": Large JSON trigram data, high-resolution textures, and combat assets create initial loading times that may discourage users."
                        - strong [ref=e1929]: Mitigation
                        - text: ": Progressive loading planned Q2 2026, asset streaming, lazy loading, optimized bundle size."
                    - listitem [ref=e1930]:
                      - paragraph [ref=e1931]:
                        - strong [ref=e1932]: 📴 Limited Offline Play
                        - text: ": Without service workers (planned v1.0), the game requires constant internet connectivity, making it inaccessible for users with unreliable connections."
                        - strong [ref=e1933]: Mitigation
                        - text: ": PWA with service workers v1.0, offline asset caching, IndexedDB for local state."
                    - listitem [ref=e1934]:
                      - paragraph [ref=e1935]:
                        - strong [ref=e1936]: 🌐 Browser Compatibility Challenges
                        - text: ": WebGL implementation differences, varying Web Audio API support, and mobile browser quirks create inconsistent experiences across platforms."
                        - strong [ref=e1937]: Mitigation
                        - text: ": Comprehensive browser testing (Chrome, Firefox, Safari, mobile browsers), polyfills, graceful degradation."
                    - listitem [ref=e1938]:
                      - paragraph [ref=e1939]:
                        - strong [ref=e1940]:
                          - generic [ref=e1941]: ⚠️
                          - text: Memory/GC Spikes
                        - text: ": High particle counts during intense combat cause garbage collection pauses, object churn in combat scenes affects performance."
                        - strong [ref=e1942]: Mitigation
                        - text: ": Object pooling, reduce particle count, optimize Zustand state updates, profile and optimize hot paths."
                    - listitem [ref=e1943]:
                      - paragraph [ref=e1944]:
                        - strong [ref=e1945]: 🔍 Complex Learning Curve
                        - text: ": Complex trigram interactions require extensive tutorials, the 70 vital point system may overwhelm newcomers, interface not immediately intuitive for casual users."
                        - strong [ref=e1946]: Mitigation
                        - text: ": Tutorial improvements Q2 2026, progressive disclosure of vital points, tooltips, contextual help, onboarding flow."
                    - listitem [ref=e1947]:
                      - paragraph [ref=e1948]:
                        - strong [ref=e1949]: 🛠️ Limited Analytics
                        - text: ": No built-in user metrics, difficulty measuring player behavior and learning progress, absence of A/B testing frameworks."
                        - strong [ref=e1950]: Mitigation
                        - text: ": Privacy-respecting analytics v1.0 (optional opt-in), AWS backend v2.0 with user behavior tracking, A/B testing framework."
                    - listitem [ref=e1951]:
                      - paragraph [ref=e1952]:
                        - strong [ref=e1953]: ⚖️ Incomplete Features (67% Combat)
                        - text: ": Some Korean martial arts techniques lack polish, missing essential mechanics for certain trigram stances, training mode limited in scope."
                        - strong [ref=e1954]: Measured
                        - text: ": 8/12 combat systems complete."
                        - strong [ref=e1955]: Mitigation
                        - text: ": Complete v1.0 by Q2-Q3 2026."
