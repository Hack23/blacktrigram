                    - heading "Current Q1 2026 Weaknesses Analysis (Measured Data)" [level=3] [ref=e1893]
                    - 'link "Permalink: Current Q1 2026 Weaknesses Analysis (Measured Data)" [ref=e1894] [cursor=pointer]':
