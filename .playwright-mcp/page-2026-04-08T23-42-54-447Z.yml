                      - /url: "#key-architectural-strengths-q1-2026"
                      - img [ref=e3254]
                  - list [ref=e3256]:
                    - listitem [ref=e3257]:
                      - strong [ref=e3258]: Three.js Migration Complete
                      - text: ": Modern 3D rendering with @react-three/fiber and @react-three/drei (60fps desktop, 30-45fps mobile with optimization ongoing)"
                    - listitem [ref=e3259]:
                      - strong [ref=e3260]: Authentic Korean Martial Arts
                      - text: ": 70/70 vital points (100% complete with 14 TCM meridians, 127 medical references), 8 trigram stances, 5 player archetypes with Korean names (무사, 암살자, 해커, 정보요원, 조직폭력배)"
                    - listitem [ref=e3261]:
                      - strong [ref=e3262]: Advanced Animation System
                      - text: ": 28-bone skeletal hierarchy, 7 hand poses with Korean terminology (주먹, 수도, 관수, 장력, 잡기, 펴기, 휴식), muscle tension visualization (0.0-1.0 intensity mapping)"
                    - listitem [ref=e3263]:
                      - strong [ref=e3264]: Combat Realism Foundation
                      - text: ": 8/12 systems complete (67%) including production-ready pain/consciousness (73 tests), body part health, vital point targeting, enhanced anatomy, visual feedback, breathing disruption (75%)"
                    - listitem [ref=e3265]:
                      - strong [ref=e3266]: High Test Coverage
                      - text: ": 73.73% overall, with detailed coverage reporting for all core systems (Vitest unit + Cypress E2E, see docs/coverage/coverage-summary.json)"
                    - listitem [ref=e3267]:
                      - strong [ref=e3268]: Zero Backend Complexity
                      - text: ": Pure frontend eliminates server management costs"
                    - listitem [ref=e3269]:
                      - strong [ref=e3270]: Modular Design
                      - text: ": Clear separation of systems/ (combat, trigram, vitalpoint, animation, pain, consciousness, breathing), components/, data/, types/"
                    - listitem [ref=e3271]:
                      - strong [ref=e3272]: Performance Optimized
                      - text: ": Three.js instancing (1000+ particles), object pooling, geometry/material reuse, automatic frustum culling, skeletal animation (28 bones vs thousands of vertices)"
                    - listitem [ref=e3273]:
                      - strong [ref=e3274]: Developer Friendly
                      - text: ": TypeScript strict mode, React 19, comprehensive testing framework (73 pain/consciousness tests production-ready)"
