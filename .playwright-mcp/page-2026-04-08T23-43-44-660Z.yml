(from, to); // In render loop (60fps) useFrame((state, delta) => { // Update animation animationMachine.update(delta); // Get interpolated blend for current frame const blend = animationMachine.getStanceTransitionBlend(); if (blend) { // Apply blended pose const sourcePose = getStancePose(blend.stance); applyBlendedPose(sourcePose, blend.blend); console.log("
