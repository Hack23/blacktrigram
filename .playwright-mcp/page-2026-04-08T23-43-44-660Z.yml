                  - paragraph [ref=e3346]:
                    - strong [ref=e3347]: Physics-First Coordinate System
                    - text: ": All combat positions and distances use meters (m) as the base unit. Hit detection uses a"
                    - strong [ref=e3348]: center-origin reach model
                    - text: where reach is calculated from the attacker's center (including body pivot offset) and distance accounts for the defender's body radius.
                  - paragraph [ref=e3349]:
                    - strong [ref=e3350]: Body Radius Calculation
                    - text: ":"
                  - generic [ref=e3351]:
                    - generic [ref=e3352]: "import { calculateBodyRadius } from \"@/utils/skeletonScaling\"; // Calculate body radius from shoulder width // Formula: bodyRadius = (shoulderWidth * 0.5) / 100 meters const defenderRadius = calculateBodyRadius(defenderPhysicalAttributes); // Archetype body radii (examples): // - Jojik (54cm shoulders): 0.270m radius // - Musa (46cm shoulders): 0.230m radius // - Hacker (43cm shoulders): 0.215m radius"
                    - button "Copy" [ref=e3354] [cursor=pointer]:
                      - img [ref=e3355]
                  - paragraph [ref=e3358]:
                    - strong [ref=e3359]: Effective Distance Formula
                    - text: ":"
                  - generic [ref=e3360]:
                    - generic [ref=e3361]: "// Center-to-center distance (Euclidean) const centerDistance = Math.sqrt( (attacker.x - defender.x) ** 2 + (attacker.y - defender.y) ** 2 ); // Effective striking distance (center to defender surface) // Note: Reach calculation already includes attacker's body pivot/offset // (shoulder offset for punches, hip rotation for kicks), so we only // subtract defender radius to avoid double-counting the attacker dimension. // Clamped to non-negative when centers overlap. const effectiveDistance = Math.max(0, centerDistance - defenderRadius); // Hit detection const inRange = effectiveDistance <= techniqueMaxReach;"
                    - button "Copy" [ref=e3363] [cursor=pointer]:
                      - img [ref=e3364]
                  - paragraph [ref=e3367]:
