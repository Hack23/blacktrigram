                  - generic [ref=e1526]:
                    - generic [ref=e1527]: "import { PlayerAnimationStateMachine, DEFAULT_ANIMATION_CONFIGS, getGuardPoseForStance } from '@/systems/animation'; import { TrigramStance } from '@/types/common'; // Initialize animation state machine const machine = new PlayerAnimationStateMachine(DEFAULT_ANIMATION_CONFIGS); // When player enters Fire stance (리) const playerStance = TrigramStance.LI; machine.transitionToStanceGuard(playerStance); // Get current guard pose for rendering if (machine.isInStanceGuard()) { const guardStance = machine.getCurrentGuardStance(); // Returns \"li\" const guardPose = getGuardPoseForStance(guardStance); // Apply to skeletal rig applyArmRotations(skeletalRig, guardPose.leftArm, guardPose.rightArm); applyTorsoRotation(skeletalRig, guardPose.torso); // Update breathing animation const breathScale = interpolate( guardPose.breathingRange.min, guardPose.breathingRange.max, machine.getCurrentFrame() / machine.getCurrentAnimation().frames ); applyBreathingScale(skeletalRig, breathScale); } // In game loop (useFrame) useFrame((state, delta) => { const result = machine.update(delta); if (result.justStarted && machine.isInStanceGuard()) { // Guard just activated playSFX('stance_guard_enter'); } if (result.frame === 0 && machine.isInStanceGuard()) { // Breathing cycle completed updateBreathingVisuals(); } }); // Transitioning between guards for tactical stance changes function adaptToOpponentStance(opponentStance: TrigramStance) { const counterStance = calculateCounterStance(opponentStance); machine.transitionToStanceGuard(counterStance); // Instant guard switch }"
