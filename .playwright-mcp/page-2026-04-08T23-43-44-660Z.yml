                  - generic [ref=e3369]:
                    - code [ref=e3371]: "Jojik (attacker) vs Hacker (defender) at 1.0m apart: - Center-to-center: 1.0m - Defender radius: 0.215m - Effective distance: 1.0 - 0.215 = 0.785m - Jojik jab reach: ~1.265m (calculated from attacker center, includes body pivot) - Arm: 0.84m - Body pivot (shoulder offset + torso): 0.37m - Peak multiplier: 0.95 - Stance: 1.1 (GEON) - Reach = (0.84 + 0.37) * 0.95 * 1.1 = 1.265m - Result: HIT (0.785m < 1.265m)"
